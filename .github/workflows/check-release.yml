name: Check FFmpeg stable release

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild and republish even if both channels are current
        type: boolean
        default: false
        required: false
    outputs:
      build:
        description: Whether a complete validated build is required
        value: ${{ jobs.check.outputs.build }}
      pages:
        description: Whether the GitHub Pages APT channel needs publication
        value: ${{ jobs.check.outputs.pages }}
      ppa:
        description: Whether the Launchpad PPA channel needs publication
        value: ${{ jobs.check.outputs.ppa }}
      pages_check:
        description: Result of the GitHub Pages update check
        value: ${{ jobs.check.outputs.pages_check }}
      ppa_check:
        description: Result of the Launchpad PPA update check
        value: ${{ jobs.check.outputs.ppa_check }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      pages: ${{ steps.decide.outputs.pages }}
      ppa: ${{ steps.decide.outputs.ppa }}
      pages_check: ${{ steps.decide.outputs.pages_check }}
      ppa_check: ${{ steps.decide.outputs.ppa_check }}
    steps:
      - name: Ensure releases only run from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error::Releases must run from the main branch"
            exit 1
          fi
      - name: Checkout packaging scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare stable FFmpeg with GitHub Pages APT
        id: pages
        continue-on-error: true
        run: python3 scripts/needs_release.py --channel pages
      - name: Compare stable FFmpeg with Launchpad PPA
        id: ppa
        continue-on-error: true
        run: python3 scripts/needs_release.py --channel ppa
      - name: Decide which channels require publication
        id: decide
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          PAGES_UPDATE: ${{ steps.pages.outputs.update }}
          PPA_UPDATE: ${{ steps.ppa.outputs.update }}
          PAGES_CHECK: ${{ steps.pages.outcome }}
          PPA_CHECK: ${{ steps.ppa.outcome }}
          STABLE_VERSION: ${{ steps.pages.outputs.version || steps.ppa.outputs.version }}
        run: |
          set -euo pipefail
          pages=false
          ppa=false
          if [[ "$PAGES_CHECK" == 'success' ]]; then
            [[ "$PAGES_UPDATE" == 'true' || "$PAGES_UPDATE" == 'false' ]] || {
              echo "::error::GitHub Pages check did not return an update decision"; exit 1;
            }
            pages="$PAGES_UPDATE"
            if [[ "$FORCE" == 'true' ]]; then pages=true; fi
          fi
          if [[ "$PPA_CHECK" == 'success' ]]; then
            [[ "$PPA_UPDATE" == 'true' || "$PPA_UPDATE" == 'false' ]] || {
              echo "::error::Launchpad check did not return an update decision"; exit 1;
            }
            ppa="$PPA_UPDATE"
            if [[ "$FORCE" == 'true' ]]; then ppa=true; fi
          fi
          build=false
          if [[ "$pages" == 'true' || "$ppa" == 'true' ]]; then
            build=true
          fi
          {
            echo "build=$build"
            echo "pages=$pages"
            echo "ppa=$ppa"
            echo "pages_check=$PAGES_CHECK"
            echo "ppa_check=$PPA_CHECK"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### FFmpeg release check"
            echo ""
            echo "- Latest stable: ${STABLE_VERSION:-unavailable}"
            echo "- Build required: $build"
            echo "- GitHub Pages check: $PAGES_CHECK (publish: $pages)"
            echo "- Launchpad PPA check: $PPA_CHECK (publish: $ppa)"
            echo "- Forced: $FORCE"
            if [[ "$PAGES_CHECK" != 'success' || "$PPA_CHECK" != 'success' ]]; then
              echo ""
              echo "**Warning:** A failed channel check is blocked from publishing;"
              echo "the other channel may still proceed. Final pipeline health will fail."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
