name: Publish to Launchpad PPA

on:
  workflow_dispatch:
    inputs:
      series:
        description: Ubuntu series (only resolute is currently validated)
        type: choice
        required: true
        default: resolute
        options:
          - resolute
          - noble
          - jammy
      revision:
        description: Increment after a failed or previously accepted upload
        type: string
        required: true
        default: '1'
  schedule:
    # Daily upstream stable check; skip when already published.
    - cron: '31 5 * * *'

permissions:
  contents: read

concurrency:
  group: ffmpeg-ppa-publish
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check for a new stable FFmpeg release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      update: ${{ steps.compare.outputs.update }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream and Launchpad PPA versions
        id: compare
        if: github.event_name == 'schedule'
        run: python3 scripts/needs_release.py --channel ppa

  prepare:
    needs: check-upstream
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.check-upstream.outputs.update == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      series: ${{ steps.config.outputs.series }}
      revision: ${{ steps.config.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select target
        id: config
        shell: bash
        env:
          INPUT_SERIES: ${{ inputs.series || 'resolute' }}
          INPUT_REVISION: ${{ inputs.revision || '1' }}
        run: |
          set -euo pipefail
          case "$INPUT_SERIES" in resolute|noble|jammy) ;; *) exit 2 ;; esac
          [[ "$INPUT_REVISION" =~ ^[1-9][0-9]*$ ]] || exit 2
          echo "series=$INPUT_SERIES" >> "$GITHUB_OUTPUT"
          echo "revision=$INPUT_REVISION" >> "$GITHUB_OUTPUT"
      - name: Configure signed Debian source-only repository
        run: sudo bash scripts/setup-build-env.sh
      - name: Build source package without credentials
        run: bash scripts/build-source.sh "$SERIES" "$REVISION"
        env:
          SERIES: ${{ steps.config.outputs.series }}
          REVISION: ${{ steps.config.outputs.revision }}
      - name: Validate source package
        run: bash scripts/verify-source.sh "$SERIES"
        env:
          SERIES: ${{ steps.config.outputs.series }}
      - name: Verify target Ubuntu build dependencies
        run: bash scripts/check-build-deps.sh "$SERIES"
        env:
          SERIES: ${{ steps.config.outputs.series }}
      - name: Upload unsigned source package (no secrets)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source-for-ppa
          path: dist/${{ steps.config.outputs.series }}/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: prepare
    # Upstream Debian scripts do not run in this credential-bearing job.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download prepared source package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-source-for-ppa
          path: dist/${{ needs.prepare.outputs.series }}
      - name: Install publication tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev devscripts dput openssh-client
      - name: Validate package and PPA version
        id: ppa_check
        shell: bash
        env:
          SERIES: ${{ needs.prepare.outputs.series }}
        run: |
          set -euo pipefail
          bash scripts/verify-source.sh "$SERIES"
          shopt -s nullglob
          changes=(dist/"$SERIES"/ffmpeg_*_source.changes)
          [[ ${#changes[@]} -eq 1 ]] || exit 1
          python3 scripts/check_launchpad.py \
            --owner alexanderwagnerdev \
            --archive ffmpeg \
            --series "$SERIES" \
            --changes "${changes[0]}"

      - name: Validate registered OpenPGP upload key
        if: steps.ppa_check.outputs.publish == 'true'
        shell: bash
        env:
          PPA_GPG_PRIVATE_KEY_B64: ${{ secrets.PPA_GPG_PRIVATE_KEY_B64 }}
          PPA_GPG_FINGERPRINT: ${{ secrets.PPA_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          for var in PPA_GPG_PRIVATE_KEY_B64 PPA_GPG_FINGERPRINT; do
            [[ -n "${!var}" ]] || { echo "::error::Missing GitHub repository secret: $var"; exit 1; }
          done

      - name: Sign and upload source to Launchpad PPA
        if: steps.ppa_check.outputs.publish == 'true'
        shell: bash
        env:
          SERIES: ${{ needs.prepare.outputs.series }}
          PPA_GPG_PRIVATE_KEY_B64: ${{ secrets.PPA_GPG_PRIVATE_KEY_B64 }}
          PPA_GPG_FINGERPRINT: ${{ secrets.PPA_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          printf '%s' "$PPA_GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          gpg --batch --list-secret-keys "$PPA_GPG_FINGERPRINT" >/dev/null
          shopt -s nullglob
          changes=(dist/"$SERIES"/ffmpeg_*_source.changes)
          [[ ${#changes[@]} -eq 1 ]] || { echo "Expected one source changes file" >&2; exit 1; }
          debsign -k "$PPA_GPG_FINGERPRINT" "${changes[0]}"
          # Same Launchpad dput transport used by OpenRTMP/librtmp2:
          # Launchpad verifies the OpenPGP signature; no SSH key is required.
          dput "ppa:alexanderwagnerdev/ffmpeg" "${changes[0]}"
          echo "Source package submitted. Monitor Launchpad for acceptance and binary builds."
