name: Build Ubuntu source packages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-source.sh'
      - 'scripts/prepare-upstream.sh'
      - 'scripts/latest_release.py'
      - 'scripts/patch_ubuntu_control.py'
      - 'scripts/patch_noble_compat.py'
      - 'tests/test_noble_compat.py'
      - 'scripts/setup-build-env.sh'
      - 'scripts/package_version.py'
      - 'scripts/verify-source.sh'
      - 'scripts/check-build-deps.sh'
      - '.github/workflows/build-source.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: Increment when rebuilding previously published version
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute, stonking]
    name: Source package ${{ matrix.series }}
    runs-on: ubuntu-latest
    env:
      SERIES: ${{ matrix.series }}
      REVISION: ${{ inputs.revision || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure signed Debian source-only repository
        run: sudo bash scripts/setup-build-env.sh
      - name: Build source package
        run: bash scripts/build-source.sh "$SERIES" "$REVISION"
      - name: Validate source package
        run: bash scripts/verify-source.sh "$SERIES"
      - name: Verify Ubuntu build dependencies
        run: bash scripts/check-build-deps.sh "$SERIES"
      - name: Preserve source package for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source-${{ matrix.series }}
          path: dist/${{ matrix.series }}/
          if-no-files-found: error
          retention-days: 7
