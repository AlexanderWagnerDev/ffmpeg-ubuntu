name: Build validated FFmpeg release packages

on:
  workflow_call:
    inputs:
      revision:
        description: Positive package revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-source:
    name: Prepare ${{ matrix.series }} FFmpeg source
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute, stonking]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified packaging automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate package revision
        env:
          REVISION: ${{ inputs.revision || '1' }}
        run: |
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]] || exit 2
      - name: Configure signed Debian source repository
        run: sudo bash scripts/setup-build-env.sh
      - name: Build and validate FFmpeg source
        env:
          REVISION: ${{ inputs.revision || '1' }}
        run: |
          bash scripts/build-source.sh "${{ matrix.series }}" "$REVISION"
          bash scripts/verify-source.sh "${{ matrix.series }}"
      - name: Upload prepared source for native builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source-${{ matrix.series }}
          path: dist/${{ matrix.series }}/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: prepare-source
    name: Build and test ${{ matrix.series }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: noble
            arch: amd64
            runner: ubuntu-latest
          - series: noble
            arch: arm64
            runner: ubuntu-26.04-arm
          - series: resolute
            arch: amd64
            runner: ubuntu-latest
          - series: resolute
            arch: arm64
            runner: ubuntu-26.04-arm
          - series: stonking
            arch: amd64
            runner: ubuntu-latest
          - series: stonking
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m):$TARGET_ARCH" in
            x86_64:amd64|aarch64:arm64) ;;
            *) echo "Runner is not the target architecture" >&2; exit 1 ;;
          esac
          docker info >/dev/null
      - name: Download source for target Ubuntu release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-source-${{ matrix.series }}
          path: dist/${{ matrix.series }}
      - name: Verify source and Ubuntu build dependencies
        run: |
          bash scripts/verify-source.sh "${{ matrix.series }}"
          bash scripts/check-build-deps.sh "${{ matrix.series }}"
      - name: Build FFmpeg binaries in native target Ubuntu container
        run: bash scripts/build-binaries.sh "${{ matrix.series }}" "${{ matrix.arch }}"
      - name: Install and smoke-test binaries in fresh target Ubuntu container
        run: bash scripts/test-binaries.sh "${{ matrix.series }}" "${{ matrix.arch }}"
      - name: Save tested binary packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-bin-${{ matrix.series }}-${{ matrix.arch }}
          path: binaries/${{ matrix.series }}/${{ matrix.arch }}/*.deb
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

