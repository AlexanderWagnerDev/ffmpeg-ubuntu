name: Validate FFmpeg native binary builds
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-binaries.sh'
      - 'scripts/test-binaries.sh'
      - 'scripts/build-source.sh'
      - 'scripts/prepare-upstream.sh'
      - 'scripts/latest_release.py'
      - 'scripts/patch_ubuntu_control.py'
      - 'scripts/check-build-deps.sh'
      - 'scripts/setup-build-env.sh'
      - 'scripts/package_version.py'
      - '.github/workflows/binary-ci.yml'
  pull_request:
    paths:
      - 'scripts/build-binaries.sh'
      - 'scripts/test-binaries.sh'
      - 'scripts/build-source.sh'
      - 'scripts/prepare-upstream.sh'
      - 'scripts/latest_release.py'
      - 'scripts/patch_ubuntu_control.py'
      - 'scripts/check-build-deps.sh'
      - 'scripts/setup-build-env.sh'
      - 'scripts/package_version.py'
      - '.github/workflows/binary-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-build-test:
    strategy:
      fail-fast: false
      matrix:
        # PRs exercise the changed debhelper-14 path on one native target.
        # Main and manual builds keep the full Ubuntu/architecture matrix.
        series: ${{ fromJSON(github.event_name == 'pull_request' && '["stonking"]' || '["noble","resolute","stonking"]') }}
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    name: FFmpeg ${{ matrix.series }}/${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout source automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure signed source index
        run: sudo bash scripts/setup-build-env.sh
      - name: Build Ubuntu source
        run: bash scripts/build-source.sh "${{ matrix.series }}" 1
      - name: Verify package source
        run: bash scripts/verify-source.sh "${{ matrix.series }}"
      - name: Verify Ubuntu build dependencies
        run: bash scripts/check-build-deps.sh "${{ matrix.series }}"
      - name: Compile native FFmpeg packages
        run: bash scripts/build-binaries.sh "${{ matrix.series }}" "${{ matrix.arch }}"
      - name: Install and smoke-test FFmpeg
        run: bash scripts/test-binaries.sh "${{ matrix.series }}" "${{ matrix.arch }}"
