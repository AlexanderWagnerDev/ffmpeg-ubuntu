name: Build Ubuntu source package
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-source.sh'
      - 'scripts/setup-build-env.sh'
      - 'scripts/package_version.py'
      - 'scripts/verify-source.sh'
      - 'scripts/check-build-deps.sh'
      - '.github/workflows/build-source.yml'
  workflow_dispatch:
    inputs:
      series:
        description: Ubuntu series
        required: true
        default: resolute
        type: choice
        options:
          - resolute
          - noble
          - jammy
      revision:
        description: Increment when rebuilding an already published Debian version
        required: true
        default: '1'
        type: string
  schedule:
    - cron: '19 4 * * 1'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERIES: ${{ inputs.series || 'resolute' }}
      REVISION: ${{ inputs.revision || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure signed Debian source-only repository
        run: sudo bash scripts/setup-build-env.sh
      - name: Build source package
        run: bash scripts/build-source.sh "$SERIES" "$REVISION"
      - name: Validate source package
        run: bash scripts/verify-source.sh "$SERIES"
      - name: Upload unsigned source archive for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source-${{ env.SERIES }}
          path: dist/${{ env.SERIES }}/
          if-no-files-found: error
          retention-days: 14
      - name: Verify target Ubuntu build dependencies
        run: bash scripts/check-build-deps.sh "$SERIES"
