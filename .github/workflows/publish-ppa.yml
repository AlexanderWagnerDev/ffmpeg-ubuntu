name: Publish to Launchpad PPA
on:
  workflow_dispatch:
    inputs:
      series:
        description: Ubuntu series (publish only after validating dependencies)
        required: true
        type: choice
        default: resolute
        options:
          - resolute
          - noble
          - jammy
      revision:
        description: Unique positive PPA revision for this Debian source version
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: ppa-publish-${{ inputs.series }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: launchpad-ppa
    env:
      SERIES: ${{ inputs.series }}
      REVISION: ${{ inputs.revision }}
      PPA_OWNER: alexanderwagnerdev
      PPA_NAME: ffmpeg
      PPA_GPG_PRIVATE_KEY_B64: ${{ secrets.PPA_GPG_PRIVATE_KEY_B64 }}
      PPA_GPG_FINGERPRINT: ${{ secrets.PPA_GPG_FINGERPRINT }}
      PPA_SSH_PRIVATE_KEY: ${{ secrets.PPA_SSH_PRIVATE_KEY }}
      PPA_SSH_KNOWN_HOSTS: ${{ secrets.PPA_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate configured credentials
        shell: bash
        run: |
          for name in PPA_GPG_PRIVATE_KEY_B64 PPA_GPG_FINGERPRINT PPA_SSH_PRIVATE_KEY PPA_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Environment secret: $name" >&2
              exit 1
            fi
          done
      - name: Configure signed Debian source-only repository
        run: sudo bash scripts/setup-build-env.sh
      - name: Build unsigned source package
        run: bash scripts/build-source.sh "$SERIES" "$REVISION"
      - name: Validate source package
        run: bash scripts/verify-source.sh "$SERIES"
      - name: Install upload tooling
        run: sudo apt-get install -y dput openssh-client
      - name: Import signing and SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.gnupg" "$HOME/.ssh"
          printf '%s' "$PPA_GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          gpg --batch --list-secret-keys "$PPA_GPG_FINGERPRINT"
          printf '%s\n' "$PPA_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PPA_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'SSH'
          Host ppa.launchpad.net
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          SSH
          chmod 600 "$HOME/.ssh/config"
      - name: Sign and upload source package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          changes=(dist/"$SERIES"/ffmpeg_*_source.changes)
          [[ "${#changes[@]}" -eq 1 ]] || { echo "Missing source changes" >&2; exit 1; }
          debsign -k "$PPA_GPG_FINGERPRINT" "${changes[0]}"
          dput "ssh-ppa:$PPA_OWNER/$PPA_NAME" "${changes[0]}"
