name: Publish FFmpeg APT via GitHub Pages

on:
  workflow_call:
    secrets:
      PAGES_APT_GPG_PRIVATE_KEY_B64:
        required: true
      PAGES_APT_GPG_FINGERPRINT:
        required: true

permissions:
  contents: read

jobs:
  sign:
    name: Sign all three Ubuntu APT suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout APT signing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all six tested Ubuntu builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-bin-*
          path: package-artifacts
      - name: Install APT signing and index utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg
      - name: Assemble and sign all Ubuntu suites
        env:
          PAGES_APT_GPG_PRIVATE_KEY_B64: ${{ secrets.PAGES_APT_GPG_PRIVATE_KEY_B64 }}
          PAGES_APT_GPG_FINGERPRINT: ${{ secrets.PAGES_APT_GPG_FINGERPRINT }}
        run: bash scripts/assemble-pages.sh package-artifacts
      - name: Verify APT signature and package indexes for all architectures
        run: bash scripts/verify-pages-apt.sh
      - name: Upload complete GitHub Pages repository
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: sign
    name: Publish verified APT repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy signed repository
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
